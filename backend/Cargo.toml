[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/api",
]

[workspace.package]
version = "0.1.20261029"
edition = "2021"
license = "MIT"
repository = "https://github.com/andresberejnoi/NetworthTracker"

[workspace.dependencies]
networth-domain = { path = "crates/domain" }
networth-application = { path = "crates/application" }
networth-adapters = { path = "crates/adapters" }

axum = "0.8"
argon2 = "0.5"
async-trait = "0.1"
bigdecimal = { version = "0.4", features = ["serde"] }
calamine = "0.26"
csv = "1.3"
proptest = "1"
rust_xlsxwriter = "0.64"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "bigdecimal"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
# calamine 0.26 is incompatible with zip >= 2.6, so pin a compatible 2.x.
zip = "=2.2.0"

[profile.release]
strip = true
