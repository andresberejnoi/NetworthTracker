[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/api",
]

[workspace.package]
version = "0.1.20261017"
edition = "2021"
license = "MIT"
repository = "https://github.com/andresberejnoi/NetworthTracker"

[workspace.dependencies]
networth-domain = { path = "crates/domain" }
networth-application = { path = "crates/application" }
networth-adapters = { path = "crates/adapters" }

axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
