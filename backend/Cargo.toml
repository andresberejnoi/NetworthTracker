[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/application",
    "crates/adapters",
    "crates/api",
]

[workspace.package]
version = "0.1.20261114"
edition = "2021"
license = "MIT"
repository = "https://github.com/andresberejnoi/NetworthTracker"

[workspace.dependencies]
networth-domain = { path = "crates/domain" }
networth-application = { path = "crates/application" }
networth-adapters = { path = "crates/adapters" }

axum = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
async-trait = "0.1"
bigdecimal = { version = "0.4", features = ["serde"] }
calamine = "0.38"
csv = "1.3"
jsonwebtoken = { version = "10.3", features = ["rust_crypto"] }
proptest = "1"
rand = "0.8"
rust_xlsxwriter = "0.102"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "time", "bigdecimal"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "process", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
strip = true
