name: networth-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env and change it}
      POSTGRES_DB: ${POSTGRES_DB:-networth}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networth} -d ${POSTGRES_DB:-networth}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    image: ghcr.io/andresberejnoi/networth-tracker-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173
      DATABASE_URL: postgres://${POSTGRES_USER:-networth}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env and change it}@db:5432/${POSTGRES_DB:-networth}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      DOCUMENT_ENCRYPTION_KEY: ${DOCUMENT_ENCRYPTION_KEY:-}
      DOCUMENT_DIR: /documents
      DOCUMENT_MAX_BYTES: ${DOCUMENT_MAX_BYTES:-20971520}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_FRONTEND_CALLBACK: ${OIDC_FRONTEND_CALLBACK:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-Sign in with SSO}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-false}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-viewer}
      OIDC_ALLOWED_EMAILS: ${OIDC_ALLOWED_EMAILS:-}
      OIDC_ALLOWED_SUBJECTS: ${OIDC_ALLOWED_SUBJECTS:-}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-groups}
      OIDC_OWNER_GROUPS: ${OIDC_OWNER_GROUPS:-}
      OIDC_EDITOR_GROUPS: ${OIDC_EDITOR_GROUPS:-}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-networth}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env and change it}
      PGDATABASE: ${POSTGRES_DB:-networth}
    volumes:
      - ./backups:/backups:Z
      - ./documents:/documents:Z
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/andresberejnoi/networth-tracker-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
