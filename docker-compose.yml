name: networth-tracker

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-networth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env and change it}
      POSTGRES_DB: ${POSTGRES_DB:-networth}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-networth} -d ${POSTGRES_DB:-networth}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    image: ghcr.io/andresberejnoi/networth-tracker-backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BACKEND_ADDR: 0.0.0.0:8080
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://localhost:5173
      DATABASE_URL: postgres://${POSTGRES_USER:-networth}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env and change it}@db:5432/${POSTGRES_DB:-networth}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_DIR: /backups
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-networth}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env and change it}
      PGDATABASE: ${POSTGRES_DB:-networth}
    volumes:
      - ./backups:/backups:Z
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ghcr.io/andresberejnoi/networth-tracker-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db-data:
