name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  boundaries:
    name: Boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No cross-project imports
        run: ./scripts/check-boundaries.sh
      - name: No committed secrets
        run: ./scripts/check-secrets.sh

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate the change strictly
        run: npx --yes @fission-ai/openspec@1.14.1 validate networth-tracker-v1 --strict

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Repository integration tests (Postgres)
        env:
          DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
        run: cargo test -p networth-adapters --features db-tests
      - run: cargo build --workspace

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typed client is up to date with the contract
        run: npm run check:api
      - run: npm run build
      - run: npm test
