name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  boundaries:
    name: Boundary check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No cross-project imports
        run: ./scripts/check-boundaries.sh
      - name: No committed secrets (fast scan)
        run: ./scripts/check-secrets.sh
      - name: Install gitleaks
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Scan full history with gitleaks
        run: gitleaks git --redact --no-banner --config .gitleaks.toml --report-format sarif --report-path gitleaks.sarif
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif

  openspec:
    name: OpenSpec validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate changes and specs strictly
        run: npx --yes @fission-ai/openspec@1.14.1 validate --all --strict

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Repository integration tests (Postgres)
        env:
          DATABASE_URL: postgres://postgres:ci-only-not-a-secret@localhost:5432/postgres
        run: cargo test -p networth-adapters --features db-tests
      - run: cargo build --workspace

  upgrade:
    name: Upgrade, backup, restore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Schema upgrade, version, encrypted backup, restore
        run: ./scripts/test-upgrade.sh
      - name: Scheduled backup wrapper
        run: ./scripts/test-backup-schedule.sh
      - name: Document cleanup safety
        run: ./scripts/test-document-cleanup.sh

  integration:
    name: Cross-boundary integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Start the API and run frontend/client integration
        run: ./scripts/integration-test.sh

  upgrade-matrix:
    name: Multi-release upgrade matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Upgrade each supported prior release
        run: ./scripts/test-upgrade-matrix.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Typed client is up to date with the contract
        run: npm run check:api
      - run: npm run build
      - run: npm test

  publish:
    name: Publish versioned images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [boundaries, openspec, backend, upgrade, upgrade-matrix, integration, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/networth-tracker-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/networth-tracker-backend:latest
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=http://localhost:8080
          tags: |
            ghcr.io/${{ github.repository_owner }}/networth-tracker-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/networth-tracker-frontend:latest
