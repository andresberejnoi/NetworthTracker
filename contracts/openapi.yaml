openapi: 3.1.0
info:
  title: NetworthTracker API
  version: 0.1.20261110
  description: |
    JSON API for the local-first NetworthTracker backend.

    This contract is a shared, root-level asset. It is the only integration
    surface between the decoupled `backend/` and `frontend/` projects: the
    backend is validated against it and the frontend's typed client is
    generated from it. Neither project imports the other's code.

    Monetary amounts are always decimal **strings**, never numbers, so no
    consumer can lose precision by parsing them as floats.
servers:
  - url: http://localhost:8080
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: system
    description: Liveness and service metadata
  - name: auth
    description: Local authentication and household members
  - name: accounts
    description: Accounts and their dated balances
  - name: networth
    description: Net worth computation and history snapshots
  - name: data
    description: Spreadsheet import/export and templates
  - name: investments
    description: Securities, holdings, prices, and FX
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/ping:
    get:
      tags: [system]
      operationId: getPing
      summary: Service metadata reply
      security: []
      responses:
        "200":
          description: Service name and version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
  /api/v1/auth/status:
    get:
      tags: [auth]
      operationId: getAuthStatus
      summary: Whether auth is enabled and first-run setup is needed
      security: []
      responses:
        "200":
          description: Authentication status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/v1/auth/setup:
    post:
      tags: [auth]
      operationId: setupOwner
      summary: Create the first owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: A session for the new owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with a username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Invalidate the current session
      responses:
        "204":
          description: Signed out.
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/oidc/start:
    get:
      tags: [auth]
      operationId: startOidcLogin
      summary: Redirect to the configured OIDC provider
      security: []
      responses:
        "302":
          description: Provider authorization redirect.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/oidc/link:
    post:
      tags: [auth]
      operationId: startOidcLink
      summary: Start linking the current user to an OIDC identity
      responses:
        "200":
          description: Authorization URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcUrl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: Complete an OIDC authorization callback
      security: []
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        "302":
          description: Frontend callback with a one-time code or linked indicator.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/auth/oidc/exchange:
    post:
      tags: [auth]
      operationId: exchangeOidcCode
      summary: Exchange a one-time SSO code for an app session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OidcExchangeRequest"
      responses:
        "200":
          description: A session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      tags: [auth]
      operationId: listUsers
      summary: List household members (owner only)
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [auth]
      operationId: createUser
      summary: Add a household member (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [auth]
      operationId: updateUserRole
      summary: Change a member's role (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backup:
    get:
      tags: [data]
      operationId: exportBackup
      summary: Full JSON backup including investments, crypto, budgets, and provenance (owner only)
      responses:
        "200":
          description: The complete backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backup/restore:
    post:
      tags: [data]
      operationId: restoreBackup
      summary: Restore a JSON backup (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Backup"
      responses:
        "200":
          description: Restore report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/migrations/preview:
    post:
      tags: [data]
      operationId: previewMigration
      summary: Dry-run a generic CSV/JSON migration (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationRequest"
      responses:
        "200":
          description: Preview summary and row errors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/migrations/apply:
    post:
      tags: [data]
      operationId: applyMigration
      summary: Apply a generic CSV/JSON migration (owner only; backup required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrationApplyRequest"
      responses:
        "200":
          description: Migration report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/documents:
    get:
      tags: [data]
      operationId: listDocuments
      summary: List uploaded financial documents (owner only)
      parameters:
        - name: include_deleted
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Document metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Document"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [data]
      operationId: uploadDocument
      summary: Upload an encrypted financial document (owner only)
      parameters:
        - name: filename
          in: query
          required: true
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Stored document metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [data]
      operationId: getDocument
      summary: Get document metadata (owner only)
      responses:
        "200":
          description: Document metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [data]
      operationId: updateDocument
      summary: Update tags or confirm document classification (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: Updated metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [data]
      operationId: deleteDocument
      summary: Soft-delete a document (owner only)
      responses:
        "204":
          description: Soft-deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [data]
      operationId: downloadDocument
      summary: Download and decrypt a document (owner only)
      responses:
        "200":
          description: Original bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/{id}/preview:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [data]
      operationId: previewDocument
      summary: Parse and preview a document (owner only)
      responses:
        "200":
          description: Parsed table and classification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPreview"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/documents/{id}/audit:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [data]
      operationId: documentAudit
      summary: List document audit events (owner only)
      responses:
        "200":
          description: Audit events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentAuditEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/documents/{id}/import:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [data]
      operationId: importDocument
      summary: Import a parsed document through the migration pipeline (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentImportRequest"
      responses:
        "200":
          description: Migration report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/securities:
    get:
      tags: [investments]
      operationId: listSecurities
      summary: List securities
      responses:
        "200":
          description: Securities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Security"
    post:
      tags: [investments]
      operationId: createSecurity
      summary: Create a security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityRequest"
      responses:
        "201":
          description: The created security.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Security"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/accounts/{id}/holdings:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [investments]
      operationId: listHoldings
      summary: List an account's holdings with valuation
      responses:
        "200":
          description: Holdings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [investments]
      operationId: createHolding
      summary: Append purchase lots to a holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHoldingRequest"
      responses:
        "201":
          description: The holding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/holdings/batch:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [investments]
      operationId: recordHoldingsBatch
      summary: Append a grid of purchase lots in one action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingBatchRequest"
      responses:
        "200":
          description: Per-row result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingBatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/holdings/{holding_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: holding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [investments]
      operationId: deleteHolding
      summary: Delete a holding
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/sales:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [investments]
      operationId: listSales
      summary: List recorded sales with FIFO disposals and realized gains
      parameters:
        - name: long_term_years
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 1
        - name: long_term_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Sales, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [investments]
      operationId: createSale
      summary: Record a sale and consume lots FIFO
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleRequest"
      responses:
        "201":
          description: The recorded sale and its disposals.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/crypto/assets:
    get:
      tags: [crypto]
      operationId: listCryptoAssets
      summary: List crypto assets
      responses:
        "200":
          description: Assets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CryptoAsset"
    post:
      tags: [crypto]
      operationId: createCryptoAsset
      summary: Create a crypto asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCryptoAssetRequest"
      responses:
        "201":
          description: The created asset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoAsset"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/crypto/wallets:
    get:
      tags: [crypto]
      operationId: listCryptoWallets
      summary: List crypto wallets
      responses:
        "200":
          description: Wallets.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CryptoWallet"
    post:
      tags: [crypto]
      operationId: createCryptoWallet
      summary: Create a manual or address wallet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCryptoWalletRequest"
      responses:
        "201":
          description: The created wallet.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoWallet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/crypto/wallets/{id}/balances:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [crypto]
      operationId: listCryptoBalances
      summary: List a wallet's dated balances
      responses:
        "200":
          description: Balances, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CryptoBalance"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [crypto]
      operationId: recordCryptoBalance
      summary: Record a manual balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCryptoBalanceRequest"
      responses:
        "201":
          description: The recorded balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/crypto/wallets/{id}/sync:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [crypto]
      operationId: syncCryptoWallet
      summary: Sync an address wallet from the configured chain provider
      responses:
        "200":
          description: The fetched balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CryptoBalance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/crypto/positions:
    get:
      tags: [crypto]
      operationId: listCryptoPositions
      summary: Aggregate latest wallet balances by asset
      parameters:
        - name: as_of
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Positions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CryptoPosition"
  /api/v1/crypto/provider:
    get:
      tags: [crypto]
      operationId: getChainProvider
      summary: Whether a chain add-on is configured
      responses:
        "200":
          description: Provider status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainProviderStatus"
  /api/v1/budget:
    get:
      tags: [budget]
      operationId: getBudget
      summary: Get income, plan, spending, and variance for a year
      parameters:
        - name: year
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Budget view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetView"
  /api/v1/budget/income:
    post:
      tags: [budget]
      operationId: setBudgetIncome
      summary: Record or replace annual income
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetIncomeRequest"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/budget/plan:
    post:
      tags: [budget]
      operationId: setBudgetPlan
      summary: Record or replace a spending plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetPlanRequest"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/budget/spending:
    post:
      tags: [budget]
      operationId: recordBudgetSpending
      summary: Record or replace category spending
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetSpendingRequest"
      responses:
        "204":
          description: Saved.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/aggregation:
    get:
      tags: [aggregation]
      operationId: getAggregation
      summary: Get aggregation status and linked-account provenance
      responses:
        "200":
          description: Aggregation view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregationView"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/aggregation/config:
    post:
