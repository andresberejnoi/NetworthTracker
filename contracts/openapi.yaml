      parameters:
        - name: base
          in: query
          required: true
          schema:
            type: string
        - name: quote
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRate"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [investments]
      operationId: setFxRate
      summary: Record an FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFxRateRequest"
      responses:
        "204":
          description: Rate stored.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List accounts
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Accounts, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Fetch one account
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [accounts]
      operationId: archiveAccount
      summary: Archive an account, preserving its history
      responses:
        "204":
          description: The account is archived.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/balances:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [accounts]
      operationId: listBalances
      summary: List an account's balances, newest first
      responses:
        "200":
          description: Dated balances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Balance"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [accounts]
      operationId: recordBalance
      summary: Record a dated balance (replaces the same-day value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBalanceRequest"
      responses:
        "201":
          description: The stored balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/balances/batch:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [accounts]
      operationId: recordBalancesBatch
      summary: Save a grid of balances in one action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBalancesRequest"
      responses:
        "200":
          description: Per-row result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSave"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/import:
    post:
      tags: [data]
      operationId: importSpreadsheet
      summary: Import accounts and balances from CSV or XLSX
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Import report. If errors are present, nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/export:
    get:
      tags: [data]
      operationId: exportSpreadsheet
      summary: Export accounts and balances
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        "200":
          description: The exported file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/template:
    get:
      tags: [data]
      operationId: getImportTemplate
      summary: Download an import template
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        "200":
          description: A template file with the expected headers.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/networth:
    get:
      tags: [networth]
      operationId: getNetWorth
      summary: Compute net worth, optionally with what-if assumptions
      parameters:
        - name: as_of
          in: query
          schema:
            type: string
            format: date
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/AggregationScope"
        - name: owner_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: owner_age
          in: query
          schema:
            type: integer
        - name: tax_rate
          in: query
          schema:
            type: string
        - name: penalty_rate
          in: query
          schema:
            type: string
        - name: penalty_age
          in: query
          schema:
            type: integer
        - name: selling_rate
          in: query
          schema:
            type: string
        - name: fixed_costs
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Computed net worth.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorth"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/networth/snapshots:
    get:
      tags: [networth]
      operationId: listSnapshots
      summary: List stored snapshots, oldest first
      parameters:
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/AggregationScope"
        - name: owner_user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshots, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"
    post:
      tags: [networth]
      operationId: createSnapshot
      summary: Compute and persist an immutable snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "201":
          description: The stored snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ping:
      type: object
      additionalProperties: false
      required: [message, service, version]
      properties:
        message:
          type: string
          examples: [pong]
        service:
          type: string
          examples: [NetworthTracker]
        version:
          type: string
          examples: ["0.1.20261110"]
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    UserRole:
      type: string
      enum: [owner, editor, viewer]
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
    AuthStatus:
      type: object
      additionalProperties: false
      required: [auth_enabled, needs_setup, oidc_enabled, oidc_button_label]
      properties:
        auth_enabled:
          type: boolean
        needs_setup:
          type: boolean
        oidc_enabled:
          type: boolean
        oidc_button_label:
          type: [string, "null"]
    OidcUrl:
      type: object
      additionalProperties: false
      required: [authorization_url]
      properties:
        authorization_url:
          type: string
    OidcExchangeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        display_name:
          type: [string, "null"]
    Session:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        display_name:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/UserRole"
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
    Table:
      type: object
      additionalProperties: false
      required: [headers, rows]
      properties:
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items:
              type: string
    Document:
      type: object
      additionalProperties: false
      required:
        - id
        - sha256
        - original_name
        - mime_type
        - byte_size
        - uploader_user_id
        - tags
        - institution
        - document_type
        - classification_confidence
        - parser_version
        - status
        - period
        - parse_error
        - nonce
        - key_version
        - created_at
        - updated_at
        - deleted_at
      properties:
        id:
          type: string
          format: uuid
        sha256:
          type: string
        original_name:
          type: string
        mime_type:
          type: string
        byte_size:
          type: integer
        uploader_user_id:
          type: [string, "null"]
          format: uuid
        tags:
          type: array
          items:
            type: string
        institution:
          type: [string, "null"]
        document_type:
          type: [string, "null"]
        classification_confidence:
          type: [number, "null"]
        parser_version:
          type: [string, "null"]
        status:
          type: string
        period:
          type: [string, "null"]
        parse_error:
          type: [string, "null"]
        nonce:
          type: string
        key_version:
          type: string
        created_at:
          type: string
        updated_at:
          type: string
        deleted_at:
          type: [string, "null"]
    DocumentAuditEvent:
      type: object
      additionalProperties: false
      required: [id, document_id, user_id, action, metadata, created_at]
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        user_id:
          type: [string, "null"]
          format: uuid
        action:
          type: string
        metadata:
          type: string
        created_at:
          type: string
    DocumentPreview:
      type: object
      additionalProperties: false
      required:
        - document
        - format
        - institution
        - document_type
        - confidence
        - table
        - error
        - audit
      properties:
        document:
          $ref: "#/components/schemas/Document"
        format:
          type: string
        institution:
          type: [string, "null"]
        document_type:
          type: [string, "null"]
        confidence:
          type: [number, "null"]
        table:
          oneOf:
            - $ref: "#/components/schemas/Table"
            - type: "null"
        error:
          type: [string, "null"]
        audit:
          type: array
          items:
            $ref: "#/components/schemas/DocumentAuditEvent"
    UpdateDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        tags:
          type: array
          items:
            type: string
        institution:
          type: string
        document_type:
          type: string
        confidence:
          type: number
        period:
          type: string
    DocumentImportRequest:
      type: object
      additionalProperties: false
      required: [mode, backup_confirmed]
      properties:
        mapping:
          type: object
          additionalProperties:
            type: string
        mode:
          $ref: "#/components/schemas/MigrationMode"
        backup_confirmed:
          type: boolean
    MigrationSourceKind:
      type: string
      enum: [generic_csv, generic_json]
    MigrationMode:
      type: string
      enum: [atomic, partial]
    MigrationRequest:
      type: object
      additionalProperties: false
      required: [source, content]
      properties:
        source:
          $ref: "#/components/schemas/MigrationSourceKind"
        mapping:
          type: object
          additionalProperties:
            type: string
        content:
          type: string
    MigrationApplyRequest:
      type: object
      additionalProperties: false
      required: [source, content, mode, backup_confirmed]
      properties:
        source:
          $ref: "#/components/schemas/MigrationSourceKind"
        mapping:
          type: object
          additionalProperties:
            type: string
        content:
          type: string
        mode:
          $ref: "#/components/schemas/MigrationMode"
        backup_confirmed:
          type: boolean
    MigrationRowError:
      type: object
      additionalProperties: false
      required: [row, message]
      properties:
        row:
          type: integer
        message:
          type: string
    MigrationPreview:
      type: object
      additionalProperties: false
      required:
        - source
        - total_rows
        - accounts
        - balances
        - holding_lots
        - crypto_wallets
        - crypto_balances
        - crypto_lots
        - errors
      properties:
        source:
          type: string
        total_rows:
          type: integer
        accounts:
          type: integer
        balances:
          type: integer
        holding_lots:
          type: integer
        crypto_wallets:
          type: integer
        crypto_balances:
          type: integer
        crypto_lots:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/MigrationRowError"
    MigrationReport:
      type: object
      additionalProperties: false
      required:
        - migration_id
        - accounts_created
        - balances_saved
        - holding_lots_saved
        - holdings_skipped
        - crypto_wallets_created
        - crypto_balances_saved
        - crypto_lots_saved
        - crypto_holdings_skipped
        - errors
      properties:
        migration_id:
          type: string
          format: uuid
        accounts_created:
          type: integer
        balances_saved:
          type: integer
        holding_lots_saved:
          type: integer
        holdings_skipped:
          type: integer
        crypto_wallets_created:
          type: integer
        crypto_balances_saved:
          type: integer
        crypto_lots_saved:
          type: integer
        crypto_holdings_skipped:
          type: integer
        errors:
          type: array
          items:
            $ref: "#/components/schemas/MigrationRowError"
    BackupAccount:
      type: object
      additionalProperties: false
      required: [name, account_type, institution, currency, ownership_scope, archived, owner_username]
      properties:
        name:
          type: string
        account_type:
          type: string
        institution:
          type: [string, "null"]
        currency:
          type: string
        ownership_scope:
          type: string
        archived:
          type: boolean
        owner_username:
          type: [string, "null"]
    BackupBalance:
      type: object
      additionalProperties: false
      required: [account_name, as_of, amount, currency, source]
      properties:
        account_name:
          type: string
        as_of:
          type: string
        amount:
          type: string
        currency:
          type: string
        source:
          type: string
    BackupSnapshot:
      type: object
      additionalProperties: false
      required:
        - as_of
        - scope
        - owner_user_id
        - owner_age
        - currency
        - total
        - liquid
        - liquidity
        - accessible
        - tax_rate
        - penalty_rate
        - penalty_age
        - selling_rate
        - fixed_costs
      properties:
        as_of:
          type: string
        scope:
          type: string
        owner_user_id:
          type: [string, "null"]
          format: uuid
        owner_age:
          type: [integer, "null"]
        currency:
          type: string
        total:
          type: string
        liquid:
          type: string
        liquidity:
          type: string
        accessible:
          type: string
        tax_rate:
          type: string
        penalty_rate:
          type: string
        penalty_age:
          type: integer
        selling_rate:
          type: string
        fixed_costs:
          type: string
    Backup:
      type: object
