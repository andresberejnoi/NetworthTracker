openapi: 3.1.0
info:
  title: NetworthTracker API
  version: 0.1.20261027
  description: |
    JSON API for the local-first NetworthTracker backend.

    This contract is a shared, root-level asset. It is the only integration
    surface between the decoupled `backend/` and `frontend/` projects: the
    backend is validated against it and the frontend's typed client is
    generated from it. Neither project imports the other's code.

    Monetary amounts are always decimal **strings**, never numbers, so no
    consumer can lose precision by parsing them as floats.
servers:
  - url: http://localhost:8080
    description: Local backend
security:
  - bearerAuth: []
tags:
  - name: system
    description: Liveness and service metadata
  - name: auth
    description: Local authentication and household members
  - name: accounts
    description: Accounts and their dated balances
  - name: networth
    description: Net worth computation and history snapshots
  - name: data
    description: Spreadsheet import/export and templates
  - name: investments
    description: Securities, holdings, prices, and FX
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The service is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/ping:
    get:
      tags: [system]
      operationId: getPing
      summary: Service metadata reply
      security: []
      responses:
        "200":
          description: Service name and version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ping"
  /api/v1/auth/status:
    get:
      tags: [auth]
      operationId: getAuthStatus
      summary: Whether auth is enabled and first-run setup is needed
      security: []
      responses:
        "200":
          description: Authentication status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthStatus"
  /api/v1/auth/setup:
    post:
      tags: [auth]
      operationId: setupOwner
      summary: Create the first owner
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "200":
          description: A session for the new owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with a username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: A session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Invalidate the current session
      responses:
        "204":
          description: Signed out.
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The current user
      responses:
        "200":
          description: The authenticated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/users:
    get:
      tags: [auth]
      operationId: listUsers
      summary: List household members (owner only)
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [auth]
      operationId: createUser
      summary: Add a household member (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The created user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [auth]
      operationId: updateUserRole
      summary: Change a member's role (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backup:
    get:
      tags: [data]
      operationId: exportBackup
      summary: Full JSON backup including snapshot history (owner only)
      responses:
        "200":
          description: The complete backup.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/backup/restore:
    post:
      tags: [data]
      operationId: restoreBackup
      summary: Restore a JSON backup (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Backup"
      responses:
        "200":
          description: Restore report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/securities:
    get:
      tags: [investments]
      operationId: listSecurities
      summary: List securities
      responses:
        "200":
          description: Securities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Security"
    post:
      tags: [investments]
      operationId: createSecurity
      summary: Create a security
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSecurityRequest"
      responses:
        "201":
          description: The created security.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Security"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/accounts/{id}/holdings:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [investments]
      operationId: listHoldings
      summary: List an account's holdings with valuation
      responses:
        "200":
          description: Holdings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Holding"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [investments]
      operationId: createHolding
      summary: Create or replace a holding and its lots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHoldingRequest"
      responses:
        "201":
          description: The holding.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Holding"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/holdings/batch:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [investments]
      operationId: recordHoldingsBatch
      summary: Save a grid of holding lots in one action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldingBatchRequest"
      responses:
        "200":
          description: Per-row result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoldingBatchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/holdings/{holding_id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
      - name: holding_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [investments]
      operationId: deleteHolding
      summary: Delete a holding
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/prices/provider:
    get:
      tags: [investments]
      operationId: getPriceProvider
      summary: Whether a price add-on is enabled
      responses:
        "200":
          description: Provider status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
  /api/v1/prices:
    post:
      tags: [investments]
      operationId: setPrice
      summary: Record a manual price override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPriceRequest"
      responses:
        "201":
          description: The stored quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/prices/{symbol}:
    parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [investments]
      operationId: getPrice
      summary: Latest quote for a symbol
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/fx-rates:
    get:
      tags: [investments]
      operationId: getFxRate
      summary: Latest FX rate
      parameters:
        - name: base
          in: query
          required: true
          schema:
            type: string
        - name: quote
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The rate.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FxRate"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [investments]
      operationId: setFxRate
      summary: Record an FX rate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetFxRateRequest"
      responses:
        "204":
          description: Rate stored.
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: List accounts
      parameters:
        - name: include_archived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Accounts, ordered by name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAccountRequest"
      responses:
        "201":
          description: The created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/accounts/{id}:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [accounts]
      operationId: getAccount
      summary: Fetch one account
      responses:
        "200":
          description: The account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [accounts]
      operationId: archiveAccount
      summary: Archive an account, preserving its history
      responses:
        "204":
          description: The account is archived.
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/balances:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    get:
      tags: [accounts]
      operationId: listBalances
      summary: List an account's balances, newest first
      responses:
        "200":
          description: Dated balances.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Balance"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [accounts]
      operationId: recordBalance
      summary: Record a dated balance (replaces the same-day value)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBalanceRequest"
      responses:
        "201":
          description: The stored balance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Balance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/accounts/{id}/balances/batch:
    parameters:
      - $ref: "#/components/parameters/AccountId"
    post:
      tags: [accounts]
      operationId: recordBalancesBatch
      summary: Save a grid of balances in one action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordBalancesRequest"
      responses:
        "200":
          description: Per-row result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSave"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/import:
    post:
      tags: [data]
      operationId: importSpreadsheet
      summary: Import accounts and balances from CSV or XLSX
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Import report. If errors are present, nothing was written.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportReport"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/export:
    get:
      tags: [data]
      operationId: exportSpreadsheet
      summary: Export accounts and balances
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        "200":
          description: The exported file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/template:
    get:
      tags: [data]
      operationId: getImportTemplate
      summary: Download an import template
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [csv, xlsx]
      responses:
        "200":
          description: A template file with the expected headers.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
  /api/v1/networth:
    get:
      tags: [networth]
      operationId: getNetWorth
      summary: Compute net worth, optionally with what-if assumptions
      parameters:
        - name: as_of
          in: query
          schema:
            type: string
            format: date
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/AggregationScope"
        - name: owner_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: owner_age
          in: query
          schema:
            type: integer
        - name: tax_rate
          in: query
          schema:
            type: string
        - name: penalty_rate
          in: query
          schema:
            type: string
        - name: penalty_age
          in: query
          schema:
            type: integer
        - name: selling_rate
          in: query
          schema:
            type: string
        - name: fixed_costs
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Computed net worth.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetWorth"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/networth/snapshots:
    get:
      tags: [networth]
      operationId: listSnapshots
      summary: List stored snapshots, oldest first
      parameters:
        - name: scope
          in: query
          schema:
            $ref: "#/components/schemas/AggregationScope"
        - name: owner_user_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshots, oldest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"
    post:
      tags: [networth]
      operationId: createSnapshot
      summary: Compute and persist an immutable snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotRequest"
      responses:
        "201":
          description: The stored snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "400":
          $ref: "#/components/responses/BadRequest"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AccountId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request was malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication is required or credentials are invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated but not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: The request conflicts with existing state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Ping:
      type: object
      additionalProperties: false
      required: [message, service, version]
      properties:
        message:
          type: string
          examples: [pong]
        service:
          type: string
          examples: [NetworthTracker]
        version:
          type: string
          examples: ["0.1.20261027"]
    ApiError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    UserRole:
      type: string
      enum: [owner, editor, viewer]
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
    AuthStatus:
      type: object
      additionalProperties: false
      required: [auth_enabled, needs_setup]
      properties:
        auth_enabled:
          type: boolean
        needs_setup:
          type: boolean
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    SetupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        display_name:
          type: [string, "null"]
    Session:
      type: object
      additionalProperties: false
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
    CreateUserRequest:
      type: object
      additionalProperties: false
      required: [username, password, role]
      properties:
        username:
          type: string
        password:
          type: string
        display_name:
          type: [string, "null"]
        role:
          $ref: "#/components/schemas/UserRole"
    UpdateRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/UserRole"
    BackupAccount:
      type: object
      additionalProperties: false
      required: [name, account_type, institution, currency, ownership_scope, archived, owner_username]
      properties:
        name:
          type: string
        account_type:
          type: string
        institution:
          type: [string, "null"]
        currency:
          type: string
        ownership_scope:
          type: string
        archived:
          type: boolean
        owner_username:
          type: [string, "null"]
    BackupBalance:
      type: object
      additionalProperties: false
      required: [account_name, as_of, amount, currency, source]
      properties:
        account_name:
          type: string
        as_of:
          type: string
        amount:
          type: string
        currency:
          type: string
        source:
          type: string
    BackupSnapshot:
      type: object
      additionalProperties: false
      required:
        - as_of
        - scope
        - owner_user_id
        - owner_age
        - currency
        - total
        - liquid
        - liquidity
        - accessible
        - tax_rate
        - penalty_rate
        - penalty_age
        - selling_rate
        - fixed_costs
      properties:
        as_of:
          type: string
        scope:
          type: string
        owner_user_id:
          type: [string, "null"]
          format: uuid
        owner_age:
          type: [integer, "null"]
        currency:
          type: string
        total:
          type: string
        liquid:
          type: string
        liquidity:
          type: string
        accessible:
          type: string
        tax_rate:
          type: string
        penalty_rate:
          type: string
        penalty_age:
          type: integer
        selling_rate:
          type: string
        fixed_costs:
          type: string
    Backup:
      type: object
      additionalProperties: false
      required: [version, exported_at, accounts, balances, snapshots]
      properties:
        version:
          type: string
        exported_at:
          type: string
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/BackupAccount"
        balances:
          type: array
          items:
            $ref: "#/components/schemas/BackupBalance"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/BackupSnapshot"
    RestoreReport:
      type: object
      additionalProperties: false
      required: [accounts_created, balances_saved, snapshots_restored, snapshots_skipped]
      properties:
        accounts_created:
          type: integer
        balances_saved:
          type: integer
        snapshots_restored:
          type: integer
        snapshots_skipped:
          type: integer
    SecurityAssetClass:
      type: string
      enum: [equity, fixed_income, real_estate, commodity, cash, other]
    Sector:
      type: string
      enum:
        - energy
        - materials
        - industrials
        - consumer_discretionary
        - consumer_staples
        - health_care
        - financials
        - information_technology
        - communication_services
        - utilities
        - real_estate
        - other
    Security:
      type: object
