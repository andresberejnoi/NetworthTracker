      operationId: listCryptoSales
      summary: List crypto sales and realized gains
      parameters:
        - name: long_term_years
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 1
        - name: long_term_days
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: Sales.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [crypto]
      operationId: createCryptoSale
      summary: Record a FIFO crypto sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaleRequest"
      responses:
        "201":
          description: The recorded sale.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/prices/provider:
    get:
      tags: [investments]
      operationId: getPriceProvider
      summary: Whether a price add-on is enabled
      responses:
        "200":
          description: Provider status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderStatus"
  /api/v1/prices:
    post:
      tags: [investments]
      operationId: setPrice
      summary: Record a manual price override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPriceRequest"
      responses:
        "201":
          description: The stored quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/v1/prices/{symbol}:
    parameters:
      - name: symbol
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [investments]
      operationId: getPrice
      summary: Latest quote for a symbol
      responses:
        "200":
          description: The quote.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/fx-rates:
    get:
      tags: [investments]
      operationId: getFxRate
