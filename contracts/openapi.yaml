      responses:
        "200":
          description: Lots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lot"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [crypto]
      operationId: createCryptoLot
      summary: Append a crypto purchase lot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LotRequest"
      responses:
        "201":
          description: The appended lots.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lot"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/crypto/wallets/{id}/sales:
    parameters:
      - name: id
