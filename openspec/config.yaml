schema: spec-driven

context: |
  Greenfield project: a local-first, offline-capable personal and family networth tracker.

  Stack: Rust backend (Axum + SQLx) exposing a JSON HTTP API, plus a TypeScript web dashboard.
  Layout: a monorepo with decoupled `backend/` and `frontend/` projects. The frontend is only a
  consumer of the backend HTTP API; neither project may import the other's code. Each project has its
  own container file, and shared assets live at the repository root.
  Packaging: runs locally, distributed as a container (Docker Compose); no cloud dependency is
  required for core use.

  Money must be exact: store monetary amounts as arbitrary-precision decimals or integer minor
  units, never binary floating point. Cryptocurrency requires many decimal places; fiat needs at
  least 2 and the model must not assume 2. All money values are currency-tagged; design for multiple
  currencies even though v1 targets USD.

  Manual data entry must work fully offline; CSV/XLSX import-export is the primary bulk-entry path.

  External integrations (bank/investment aggregation, market prices, on-chain data) sit behind
  read-only adapter interfaces and must never be required for core functionality.

  Versioning: date-based semantic versioning, MAJOR.MINOR.yyyymmdd, where the UTC release date
  replaces the numeric patch (for example 0.1.20261017). The authoritative value lives in
  backend/Cargo.toml and is mirrored into frontend/package.json and contracts/openapi.yaml. See
  AGENTS.md and the release-versioning spec.

  Specs describe user-observable behavior and domain rules; keep infrastructure and framework
  choices in design.md.

